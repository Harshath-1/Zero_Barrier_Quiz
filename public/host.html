<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Quiz Setup</title>
  <style>
    :root {
      --bg-black: #080808;
      --card-bg: rgba(18, 18, 18, 0.92);
      --card-border: rgba(250, 204, 21, 0.35);
      --yellow-bright: #facc15;
      --text-white: #ffffff;
      --text-muted: #a3a3a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-white); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(18px); border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 0 35px rgba(0,0,0,0.95), 0 0 25px rgba(250,204,21,0.15); width: 100%; max-width: 580px; padding: 28px; }
    .club-banner-wrapper { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 18px; border: 1.5px solid var(--yellow-bright); }
    .club-banner { width: 100%; display: block; max-height: 145px; object-fit: cover; }
    .title-banner { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--yellow-bright); text-align: center; margin-bottom: 6px; }
    .info-line { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
    .inset-data-input, .category-input { width: 100%; background: #0f0f0f; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 12px 16px; color: var(--text-white); font-size: 15px; margin-bottom: 14px; outline: none; }
    .inset-data-input { font-size: 16px; font-weight: 700; border-color: var(--yellow-bright); }
    .field-label { display: block; font-size: 12px; text-transform: uppercase; font-weight: 800; color: var(--yellow-bright); margin-bottom: 6px; }
    .yellow-btn { width: 100%; padding: 15px; background: var(--yellow-bright); border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 20px rgba(250, 204, 21, 0.45); }
    .yellow-btn:hover { background: #fde047; }
    .pin-display-box { background: #0f0f0f; border: 1.5px dashed var(--yellow-bright); border-radius: 16px; padding: 22px; margin: 18px 0; text-align: center; }
    .pin-number { font-size: 52px; font-weight: 900; letter-spacing: 8px; color: var(--yellow-bright); }
    .pill-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 140px; overflow-y: auto; padding: 12px; margin: 16px 0; background: #0f0f0f; border-radius: 12px; }
    .player-pill { background: rgba(250, 204, 21, 0.15); border: 1px solid var(--yellow-bright); border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
    .host-tile { background: #121212; border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 16px 14px; font-size: 16px; font-weight: 700; }
    .correct-highlight { border: 2px solid #ffffff !important; background: rgba(255, 255, 255, 0.25) !important; color: #fff !important; }
    .dimmed-tile { opacity: 0.25; }
    .control-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 16px; }
    .btn-action { padding: 10px 18px; border-radius: 10px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
    .btn-reveal { background: var(--yellow-bright); color: #000; }
    .btn-next { background: #ffffff; color: #000; }
    .btn-end { background: #262626; color: #fff; }
    .badge-hud { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 900; background: rgba(250, 204, 21, 0.12); border: 1px solid var(--yellow-bright); color: var(--yellow-bright); }
  </style>
</head>
<body>

  <!-- 1. SETUP CARD -->
  <div id="setup-card" class="glass-card">
    <div class="club-banner-wrapper">
      <img src="/mailtemplate.png" alt="ALIET Techpreneur Club" class="club-banner">
    </div>
    <div class="title-banner">HOST QUIZ SETUP</div>
    <div class="info-line">Set session PIN & question tier topics</div>

    <input id="pin-input" class="inset-data-input" type="text" maxlength="6" placeholder="Enter PIN (e.g. 123123)" />

    <label class="field-label">Tier 1: Easy (7 Questions)</label>
    <input id="t1-input" class="category-input" type="text" value="Maths" />

    <label class="field-label">Tier 2: Moderate (7 Questions)</label>
    <input id="t2-input" class="category-input" type="text" value="Physics" />

    <label class="field-label">Tier 3: Hard (6 Questions)</label>
    <input id="t3-input" class="category-input" type="text" value="Chemistry" />

    <button id="gen-btn" class="yellow-btn" onclick="createRoom()">Generate Session & PIN</button>
  </div>

  <!-- 2. LOBBY CARD -->
  <div id="lobby-card" class="glass-card" style="display:none; text-align: center;">
    <div class="badge-hud">SESSION PIN READY</div>
    <div class="pin-display-box">
      <div style="font-size: 13px; color: var(--text-muted);">Join PIN</div>
      <div id="display-pin" class="pin-number">------</div>
      <div style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">Enter PIN at <strong>/player.html</strong></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:14px; margin: 10px 4px;">
      <span style="color:var(--text-muted);">Joined Players</span>
      <span style="color:var(--yellow-bright); font-weight:800;"><span id="player-count">0</span> Online</span>
    </div>
    <div id="lobby-players" class="pill-grid">
      <span style="color: var(--text-muted); font-size: 13px; margin: auto;">Waiting for players...</span>
    </div>
    <button class="yellow-btn" onclick="triggerAction('NEXT')">Launch Quiz ➜</button>
  </div>

  <!-- 3. QUESTION VIEW CARD -->
  <div id="question-card" class="glass-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <span id="level-badge" class="badge-hud">EASY</span>
      <span id="question-counter" style="color:var(--text-muted); font-size:14px; font-weight:700;">Question 1 / 20</span>
    </div>
    <div id="question-text" style="font-size: 20px; font-weight: 800; text-align: center; margin: 16px 0;">Loading...</div>
    <div class="grid">
      <div class="host-tile" id="tile-0">A. <span id="opt-0"></span></div>
      <div class="host-tile" id="tile-1">B. <span id="opt-1"></span></div>
      <div class="host-tile" id="tile-2">C. <span id="opt-2"></span></div>
      <div class="host-tile" id="tile-3">D. <span id="opt-3"></span></div>
    </div>
    <div class="control-row">
      <div style="font-size: 14px; color: var(--text-muted);">
        Responses: <strong id="response-count" style="color:#ffffff;">0 / 0</strong>
      </div>
      <div style="display:flex; gap: 8px;">
        <button class="btn-action btn-reveal" onclick="triggerAction('REVEAL')">Reveal</button>
        <button class="btn-action btn-next" onclick="triggerAction('NEXT')">Next ➜</button>
        <button class="btn-action btn-end" onclick="triggerAction('END')">End</button>
      </div>
    </div>
  </div>

  <!-- 4. FINAL PODIUM CARD -->
  <div id="end-card" class="glass-card" style="display:none; text-align: center;">
    <div class="badge-hud">QUIZ COMPLETED</div>
    <div class="title-banner" style="font-size:20px; margin-top: 10px;">FINAL STANDINGS</div>
    <div id="leaderboard-container" style="margin-top: 16px;"></div>
    <button class="yellow-btn" style="margin-top: 22px;" onclick="location.reload()">+ Start New Session</button>
  </div>

  <script>
    let currentPin = '';
    let pollTimer = null;

    async function createRoom() {
      const pin = document.getElementById('pin-input').value.trim();
      const t1 = document.getElementById('t1-input').value.trim();
      const t2 = document.getElementById('t2-input').value.trim();
      const t3 = document.getElementById('t3-input').value.trim();

      const btn = document.getElementById('gen-btn');
      btn.textContent = 'Generating Session...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/create-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customPin: pin, topic1: t1, topic2: t2, topic3: t3 })
        });
        const data = await res.json();

        if (res.ok && data.pin) {
          currentPin = data.pin;
          document.getElementById('setup-card').style.display = 'none';
          document.getElementById('lobby-card').style.display = 'block';
          document.getElementById('display-pin').textContent = data.pin;
          
          startPolling();
        } else {
          alert('Failed to create session: ' + (data.error || 'Server error'));
        }
      } catch (err) {
        alert('Network connection error: ' + err.message);
      } finally {
        btn.textContent = 'Generate Session & PIN';
        btn.disabled = false;
      }
    }

    async function triggerAction(action) {
      if (!currentPin) return;
      await fetch('/api/host-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: currentPin, action })
      });
      fetchRoomStatus();
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(fetchRoomStatus, 1500);
      fetchRoomStatus();
    }

    async function fetchRoomStatus() {
      if (!currentPin) return;
      try {
        const res = await fetch(`/api/room-status?pin=${currentPin}`);
        if (!res.ok) return;
        const data = await res.json();

        // Update Lobby
        document.getElementById('player-count').textContent = data.playerCount;
        if (data.players && data.players.length > 0) {
          document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-pill">${p}</span>`).join('');
        }

        // View Transitions
        if (data.state === 'QUESTION' || data.state === 'REVEAL') {
          document.getElementById('lobby-card').style.display = 'none';
          document.getElementById('question-card').style.display = 'block';

          if (data.question) {
            document.getElementById('level-badge').textContent = data.question.level;
            document.getElementById('question-counter').textContent = `Question ${data.question.index} / ${data.question.total}`;
            document.getElementById('question-text').textContent = data.question.question;

            for (let i = 0; i < 4; i++) {
              const tile = document.getElementById(`tile-${i}`);
              document.getElementById(`opt-${i}`).textContent = data.question.options[i];
              tile.className = 'host-tile';
              if (data.state === 'REVEAL') {
                if (i === data.revealedAnswer) tile.classList.add('correct-highlight');
                else tile.classList.add('dimmed-tile');
              }
            }
          }
          document.getElementById('response-count').textContent = `${data.responsesCount} / ${data.playerCount}`;
        } else if (data.state === 'FINISHED') {
          clearInterval(pollTimer);
          document.getElementById('question-card').style.display = 'none';
          document.getElementById('lobby-card').style.display = 'none';
          document.getElementById('end-card').style.display = 'block';

          const rows = data.leaderboard.map((p, idx) => `
            <div style="display:flex; justify-content:space-between; padding: 10px 16px; border-bottom: 1px solid rgba(250,204,21,0.2); font-size: 15px;">
              <span>#${idx + 1} ${p.name}</span>
              <span style="color:var(--yellow-bright);"><strong>${p.score} pts</strong> (${p.correctCount} correct)</span>
            </div>
          `).join('');

          document.getElementById('leaderboard-container').innerHTML = `
            <div style="background: #0f0f0f; border-radius: 12px; border: 1px solid rgba(250,204,21,0.3);">${rows}</div>
          `;
        }
      } catch (e) {
        console.error('Polling error', e);
      }
    }
  </script>
</body>
</html>
