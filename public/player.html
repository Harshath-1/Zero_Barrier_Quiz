
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALIET Techpreneur Club - Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #07080b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    /* Outer Wrapper matching Host's outer container */
    .host-card {
      width: 100%;
      max-width: 560px;
      background: #0f1015;
      border: 1px solid #232014;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
    }

    /* Top Logo Banner identical to Host */
    .banner-container {
      width: 100%;
      background: #ffbe00;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      margin-bottom: 24px;
    }

    .banner-container img {
      max-width: 100%;
      max-height: 95px;
      object-fit: contain;
      display: block;
    }

    /* Headers matching Host screen */
    .title-section {
      text-align: center;
      margin-bottom: 22px;
    }

    .main-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #ffbe00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #8b92a5;
    }

    .card {
      display: none;
    }

    .card.active {
      display: block;
    }

    /* Form Fields */
    .input-block {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #ffbe00;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #08090d;
      border: 1px solid #242735;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #ffbe00;
    }

    input[type="text"]::placeholder {
      color: #4f5366;
    }

    /* Primary Gold Button identical to "GENERATE SESSION & PIN" */
    .btn-gold {
      width: 100%;
      height: 50px;
      background: #ffbe00;
      color: #000000;
      font-size: 0.92rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.05s;
    }

    .btn-gold:hover {
      background: #e6ab00;
    }

    .btn-gold:active {
      transform: scale(0.99);
    }

    .btn-gold:disabled {
      background: #252733;
      color: #555b6e;
      cursor: not-allowed;
    }

    /* Player Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #08090d;
      border: 1px solid #242735;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .status-bar .name {
      color: #ffffff;
    }

    .status-bar .score {
      color: #ffbe00;
    }

    /* Question Typography */
    .badge-tier {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #ffbe00;
      background: rgba(255, 190, 0, 0.1);
      border: 1px solid rgba(255, 190, 0, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 18px;
      color: #ffffff;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .opt-btn {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      background: #08090d;
      border: 1px solid #242735;
      border-radius: 8px;
      color: #d1d5db;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt-btn:hover {
      background: #14161f;
      border-color: #383c50;
    }

    .opt-btn.selected {
      border: 2px solid #ffbe00 !important;
      background: rgba(255, 190, 0, 0.12) !important;
      color: #ffbe00 !important;
      font-weight: 700;
    }

    .opt-btn.correct {
      background: rgba(46, 213, 115, 0.2) !important;
      border: 2px solid #2ed573 !important;
      color: #2ed573 !important;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: rgba(255, 71, 87, 0.2) !important;
      border: 2px solid #ff4757 !important;
      color: #ff4757 !important;
      font-weight: 700;
    }

    /* Information / Waiting message boxes */
    .info-box {
      text-align: center;
      padding: 36px 12px;
    }

    .info-box h2 {
      font-size: 1.25rem;
      color: #ffbe00;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .info-box p {
      color: #8b92a5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="host-card">
    
    <!-- Exact banner container as host screen -->
    <div class="banner-container">
      <img src="logo.jpeg" alt="ALIET Techpreneur Club" onerror="this.src='logo_vertical.jpeg'; this.onerror=null;">
    </div>

    <!-- 1. JOIN VIEW -->
    <div id="join-card" class="card active">
      <div class="title-section">
        <div class="main-title">PLAYER QUIZ PORTAL</div>
        <div class="sub-title">Enter active session PIN & player handle</div>
      </div>

      <div class="input-block">
        <label for="pin-input">SESSION PIN</label>
        <input type="text" id="pin-input" placeholder="Enter PIN (e.g. 123123)" autocomplete="off">
      </div>

      <div class="input-block">
        <label for="name-input">PLAYER NAME</label>
        <input type="text" id="name-input" placeholder="Enter your name" autocomplete="off">
      </div>

      <button class="btn-gold" id="join-btn" onclick="joinGame()">ENTER SESSION</button>
    </div>

    <!-- 2. LOBBY VIEW -->
    <div id="lobby-card" class="card">
      <div class="info-box">
        <h2>YOU ARE IN!</h2>
        <p>Waiting for the host to launch the first round...</p>
      </div>
    </div>

    <!-- 3. QUESTION VIEW -->
    <div id="question-card" class="card">
      <div class="status-bar">
        <span id="player-tag" class="name">Player</span>
        <span id="score-tag" class="score">SCORE: 0</span>
      </div>

      <div class="badge-tier" id="level-badge">QUESTION 1</div>
      <div class="question-title" id="question-title">Loading question...</div>

      <div class="options-list" id="options-container">
        <!-- Rendered dynamically -->
      </div>

      <button class="btn-gold" id="confirm-btn" onclick="submitAnswer()" disabled>CONFIRM ANSWER</button>
    </div>

    <!-- 4. SUBMITTED WAITING VIEW -->
    <div id="wait-card" class="card">
      <div class="info-box">
        <h2>ANSWER LOCKED IN!</h2>
        <p>Waiting for host to reveal results...</p>
      </div>
    </div>

    <!-- 5. FINISHED VIEW -->
    <div id="finished-card" class="card">
      <div class="info-box">
        <h2>QUIZ CONCLUDED!</h2>
        <p>Check the host presentation screen for the winners.</p>
      </div>
    </div>

  </div>

  <script>
    let currentPin = '';
    let playerName = '';
    let selectedOption = null;
    let hasAnsweredCurrentRound = false;
    let lastSeenQuestionIndex = 0;
    let pollInterval = null;

    function showCard(cardId) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      const target = document.getElementById(cardId);
      if (target) target.classList.add('active');
    }

    async function joinGame() {
      const pin = document.getElementById('pin-input').value.trim();
      const name = document.getElementById('name-input').value.trim();

      if (!pin || !name) {
        alert('Please fill in both Session PIN and Your Name.');
        return;
      }

      const joinBtn = document.getElementById('join-btn');
      joinBtn.disabled = true;
      joinBtn.innerText = 'CONNECTING...';

      try {
        const res = await fetch('/api/join-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, name })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          alert(data.error || 'Failed to join session.');
          joinBtn.disabled = false;
          joinBtn.innerText = 'ENTER SESSION';
          return;
        }

        currentPin = pin;
        playerName = name;
        document.getElementById('player-tag').innerText = playerName;

        showCard('lobby-card');
        startPolling();
      } catch (err) {
        alert('Cannot reach the quiz server.');
        joinBtn.disabled = false;
        joinBtn.innerText = 'ENTER SESSION';
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchRoomState, 1500);
      fetchRoomState();
    }

    async function fetchRoomState() {
      if (!currentPin) return;

      try {
        const res = await fetch(`/api/room-status?pin=${encodeURIComponent(currentPin)}&t=${Date.now()}`);
        if (!res.ok) return;

        const data = await res.json();

        if (Array.isArray(data.leaderboard)) {
          const me = data.leaderboard.find(p => p.name.toLowerCase() === playerName.toLowerCase());
          if (me) {
            document.getElementById('score-tag').innerText = `SCORE: ${me.score}`;
          }
        }

        if (data.state === 'LOBBY') {
          showCard('lobby-card');
        } else if (data.state === 'QUESTION') {
          if (data.currentIndex !== lastSeenQuestionIndex) {
            lastSeenQuestionIndex = data.currentIndex;
            hasAnsweredCurrentRound = false;
            selectedOption = null;
            renderQuestion(data.question);
            showCard('question-card');
          } else {
            if (hasAnsweredCurrentRound) {
              showCard('wait-card');
            } else {
              showCard('question-card');
            }
          }
        } else if (data.state === 'REVEAL') {
          if (data.revealedAnswer !== null && data.revealedAnswer !== undefined) {
            highlightAnswers(data.revealedAnswer);
            showCard('question-card');
          }
        } else if (data.state === 'FINISHED') {
          showCard('finished-card');
          clearInterval(pollInterval);
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    function renderQuestion(q) {
      if (!q) return;

      document.getElementById('level-badge').innerText = `Q${q.index} • ${q.level || 'TRIVIA'}`;
      document.getElementById('question-title').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = 'CONFIRM ANSWER';
    }

    function selectOption(index, btnElement) {
      if (hasAnsweredCurrentRound) return;

      selectedOption = index;
      document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = false;
    }

    async function submitAnswer() {
      if (selectedOption === null || hasAnsweredCurrentRound) return;

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = 'RECORDING...';

      try {
        const res = await fetch('/api/submit-answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pin: currentPin,
            name: playerName,
            answerIndex: selectedOption
          })
        });

        const data = await res.json();
        if (res.ok && (data.success || data.message)) {
          hasAnsweredCurrentRound = true;
          showCard('wait-card');
        } else {
          confirmBtn.disabled = false;
          confirmBtn.innerText = 'CONFIRM ANSWER';
          alert(data.error || 'Submission error.');
        }
      } catch (err) {
        confirmBtn.disabled = false;
        confirmBtn.innerText = 'CONFIRM ANSWER';
        alert('Network connection error.');
      }
    }

    function highlightAnswers(correctIndex) {
      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach((btn, idx) => {
        btn.onclick = null;
        if (idx === correctIndex) {
          btn.classList.add('correct');
        } else if (idx === selectedOption) {
          btn.classList.add('wrong');
        }
      });
      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = 'ANSWER REVEALED';
    }
  </script>
</body>
</html>
