<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Barrier Quiz - Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #171922;
      border: 1px solid #2a2e3d;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #f7b928;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card {
      display: none;
    }

    .card.active {
      display: block;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a6b5;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0d0e12;
      border: 1px solid #2a2e3d;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #f7b928;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #f7b928;
      color: #0d0e12;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #dfa31b;
    }

    .btn:disabled {
      background: #3b3f4d;
      color: #7b8191;
      cursor: not-allowed;
    }

    .question-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #f7b928;
      background: rgba(247, 185, 40, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      padding: 14px;
      text-align: left;
      background: #232736;
      border: 2px solid transparent;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #2b3042;
    }

    .option-btn.selected {
      border-color: #f7b928;
      background: rgba(247, 185, 40, 0.15);
      color: #f7b928;
      font-weight: 600;
    }

    .option-btn.correct {
      background: rgba(46, 213, 115, 0.2) !important;
      border-color: #2ed573 !important;
      color: #2ed573 !important;
    }

    .option-btn.wrong {
      background: rgba(255, 71, 87, 0.2) !important;
      border-color: #ff4757 !important;
      color: #ff4757 !important;
    }

    .status-box {
      text-align: center;
      padding: 30px 10px;
    }

    .status-box h2 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .status-box p {
      color: #a0a6b5;
      font-size: 0.9rem;
    }

    .score-banner {
      display: flex;
      justify-content: space-between;
      background: #232736;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Quiz Player</h1>
    </div>

    <!-- 1. JOIN CARD -->
    <div id="join-card" class="card active">
      <div class="input-group">
        <label>Game PIN</label>
        <input type="text" id="pin-input" placeholder="e.g. 123456" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="name-input" placeholder="Enter your name" autocomplete="off">
      </div>
      <button class="btn" id="join-btn" onclick="joinGame()">Enter Game</button>
    </div>

    <!-- 2. LOBBY WAITING CARD -->
    <div id="lobby-card" class="card">
      <div class="status-box">
        <h2>You're in!</h2>
        <p>Waiting for the host to start the first question...</p>
      </div>
    </div>

    <!-- 3. QUESTION CARD -->
    <div id="question-card" class="card">
      <div class="score-banner">
        <span id="player-tag">Player</span>
        <span id="score-tag">Score: 0</span>
      </div>

      <div class="question-badge" id="level-badge">QUESTION</div>
      <div class="question-text" id="question-title">Loading question...</div>

      <div class="options-grid" id="options-container">
        <!-- Rendered dynamically -->
      </div>

      <button class="btn" id="confirm-btn" onclick="submitAnswer()" disabled>Confirm Answer</button>
    </div>

    <!-- 4. SUBMITTED WAITING CARD -->
    <div id="wait-card" class="card">
      <div class="status-box">
        <h2>Answer Locked In!</h2>
        <p>Waiting for host to reveal the correct answer...</p>
      </div>
    </div>

    <!-- 5. FINISHED CARD -->
    <div id="finished-card" class="card">
      <div class="status-box">
        <h2>Quiz Completed!</h2>
        <p id="final-stats">Check the host screen for final rankings!</p>
      </div>
    </div>
  </div>

  <script>
    let currentPin = '';
    let playerName = '';
    let selectedOption = null;
    let hasAnsweredCurrentRound = false;
    let lastSeenQuestionIndex = 0;
    let pollInterval = null;

    function showCard(cardId) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      const target = document.getElementById(cardId);
      if (target) target.classList.add('active');
    }

    async function joinGame() {
      const pin = document.getElementById('pin-input').value.trim();
      const name = document.getElementById('name-input').value.trim();

      if (!pin || !name) {
        alert('Please enter both PIN and Name.');
        return;
      }

      document.getElementById('join-btn').disabled = true;
      document.getElementById('join-btn').innerText = 'Connecting...';

      try {
        const res = await fetch('/api/join-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, name })
        });

        const data = await res.json();
        if (!res.ok || !data.success) {
          alert(data.error || 'Failed to join room.');
          document.getElementById('join-btn').disabled = false;
          document.getElementById('join-btn').innerText = 'Enter Game';
          return;
        }

        currentPin = pin;
        playerName = name;
        document.getElementById('player-tag').innerText = playerName;

        showCard('lobby-card');
        startPolling();
      } catch (err) {
        alert('Could not connect to server.');
        document.getElementById('join-btn').disabled = false;
        document.getElementById('join-btn').innerText = 'Enter Game';
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchRoomState, 1500);
      fetchRoomState();
    }

    async function fetchRoomState() {
      if (!currentPin) return;

      try {
        const res = await fetch(`/api/room-status?pin=${encodeURIComponent(currentPin)}&t=${Date.now()}`);
        if (!res.ok) return;

        const data = await res.json();

        // Update player score from leaderboard
        if (Array.isArray(data.leaderboard)) {
          const me = data.leaderboard.find(p => p.name.toLowerCase() === playerName.toLowerCase());
          if (me) {
            document.getElementById('score-tag').innerText = `Score: ${me.score}`;
          }
        }

        if (data.state === 'LOBBY') {
          showCard('lobby-card');
        } else if (data.state === 'QUESTION') {
          // New question round
          if (data.currentIndex !== lastSeenQuestionIndex) {
            lastSeenQuestionIndex = data.currentIndex;
            hasAnsweredCurrentRound = false;
            selectedOption = null;
            renderQuestion(data.question);
            showCard('question-card');
          } else if (!hasAnsweredCurrentRound) {
            showCard('question-card');
          }
        } else if (data.state === 'REVEAL') {
          if (data.revealedAnswer !== null && data.revealedAnswer !== undefined) {
            highlightAnswers(data.revealedAnswer);
            showCard('question-card');
          }
        } else if (data.state === 'FINISHED') {
          showCard('finished-card');
          clearInterval(pollInterval);
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    function renderQuestion(q) {
      if (!q) return;

      document.getElementById('level-badge').innerText = `Q${q.index} • ${q.level || 'TRIVIA'}`;
      document.getElementById('question-title').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = 'Confirm Answer';
    }

    function selectOption(index, btnElement) {
      if (hasAnsweredCurrentRound) return;

      selectedOption = index;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');

      document.getElementById('confirm-btn').disabled = false;
    }

    async function submitAnswer() {
      if (selectedOption === null || hasAnsweredCurrentRound) return;

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.innerText = 'Submitting...';

      try {
        const res = await fetch('/api/submit-answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pin: currentPin,
            name: playerName,
            answerIndex: selectedOption
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          hasAnsweredCurrentRound = true;
          showCard('wait-card');
        } else {
          confirmBtn.disabled = false;
          confirmBtn.innerText = 'Confirm Answer';
          alert(data.error || 'Could not submit answer.');
        }
      } catch (err) {
        console.error('Submit error:', err);
        confirmBtn.disabled = false;
        confirmBtn.innerText = 'Confirm Answer';
        alert('Network error while submitting answer.');
      }
    }

    function highlightAnswers(correctIndex) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.onclick = null; // disable further clicks
        if (idx === correctIndex) {
          btn.classList.add('correct');
        } else if (idx === selectedOption) {
          btn.classList.add('wrong');
        }
      });
      document.getElementById('confirm-btn').disabled = true;
      document.getElementById('confirm-btn').innerText = 'Answer Revealed';
    }
  </script>
</body>
</html>
