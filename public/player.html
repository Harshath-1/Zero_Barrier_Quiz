<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Quiz Portal</title>
  <style>
    :root {
      --bg-black: #080808;
      --card-bg: rgba(18, 18, 18, 0.92);
      --card-border: rgba(250, 204, 21, 0.35);
      --yellow-bright: #facc15;
      --text-white: #ffffff;
      --text-muted: #a3a3a3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(250, 204, 21, 0.15);
      width: 100%;
      max-width: 580px;
      padding: 28px;
    }
    .club-banner-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1.5px solid var(--yellow-bright);
    }
    .club-banner {
      width: 100%;
      display: block;
      max-height: 145px;
      object-fit: cover;
    }
    .title-banner {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--yellow-bright);
      text-align: center;
      margin-bottom: 6px;
    }
    .info-line {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .field-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--yellow-bright);
      margin-bottom: 6px;
    }
    .inset-data-input, .category-input {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-white);
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }
    .inset-data-input {
      font-size: 16px;
      font-weight: 700;
      border-color: var(--yellow-bright);
    }
    .yellow-btn {
      width: 100%;
      padding: 15px;
      background: var(--yellow-bright);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.45);
      transition: background 0.2s;
    }
    .yellow-btn:hover {
      background: #fde047;
    }
    .yellow-btn:disabled {
      background: #262626;
      color: #525252;
      box-shadow: none;
      cursor: not-allowed;
    }
    .pin-display-box {
      background: #0f0f0f;
      border: 1.5px dashed var(--yellow-bright);
      border-radius: 16px;
      padding: 22px;
      margin: 18px 0;
      text-align: center;
    }
    .badge-hud {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid var(--yellow-bright);
      color: var(--yellow-bright);
      text-transform: uppercase;
    }
    /* Options 2x2 grid identical to Host view */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }
    .host-tile {
      background: #121212;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 14px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-white);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .host-tile:hover {
      background: #1a1a1a;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .host-tile.selected {
      border: 2px solid var(--yellow-bright) !important;
      background: rgba(250, 204, 21, 0.15) !important;
      color: var(--yellow-bright) !important;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
    }
    .host-tile.correct {
      border: 2px solid #2ed573 !important;
      background: rgba(46, 213, 115, 0.25) !important;
      color: #ffffff !important;
    }
    .host-tile.wrong {
      border: 2px solid #ff4757 !important;
      background: rgba(255, 71, 87, 0.25) !important;
      color: #ffffff !important;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- 1. PLAYER JOIN CARD -->
  <div id="join-card" class="glass-card">
    <div class="club-banner-wrapper">
      <img src="/mailtemplate.png" alt="ALIET Techpreneur Club" class="club-banner" />
    </div>
    <div class="title-banner">PLAYER QUIZ PORTAL</div>
    <div class="info-line">Enter active session PIN & your name</div>

    <label class="field-label">Session PIN</label>
    <input id="pin-input" class="inset-data-input" type="text" maxlength="6" placeholder="Enter PIN (e.g. 556677)" autocomplete="off" />

    <label class="field-label">Player Name</label>
    <input id="name-input" class="category-input" type="text" placeholder="Enter your full name" autocomplete="off" />

    <button id="join-btn" class="yellow-btn" onclick="joinGame()">Enter Session</button>
  </div>

  <!-- 2. LOBBY WAITING CARD -->
  <div id="lobby-card" class="glass-card" style="display: none; text-align: center;">
    <div class="badge-hud">LOBBY CONNECTED</div>
    <div class="pin-display-box">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Player Handle</div>
      <div id="display-player" style="font-size: 32px; font-weight: 900; color: var(--yellow-bright);">Player</div>
      <div style="font-size: 14px; color: var(--text-muted); margin-top: 10px;">Waiting for host to launch the quiz...</div>
    </div>
  </div>

  <!-- 3. QUESTION CARD -->
  <div id="question-card" class="glass-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span id="level-badge" class="badge-hud">EASY</span>
      <span id="score-counter" style="color: var(--yellow-bright); font-size: 14px; font-weight: 800;">Score: 0</span>
    </div>

    <div id="question-text" style="font-size: 20px; font-weight: 800; text-align: center; margin: 16px 0;">Loading question...</div>

    <div class="grid">
      <button class="host-tile" id="tile-0" onclick="selectOption(0)">A. <span id="opt-0"></span></button>
      <button class="host-tile" id="tile-1" onclick="selectOption(1)">B. <span id="opt-1"></span></button>
      <button class="host-tile" id="tile-2" onclick="selectOption(2)">C. <span id="opt-2"></span></button>
      <button class="host-tile" id="tile-3" onclick="selectOption(3)">D. <span id="opt-3"></span></button>
    </div>

    <button id="confirm-btn" class="yellow-btn" onclick="submitAnswer()" disabled>Confirm Answer</button>
  </div>

  <!-- 4. ANSWER LOCKED IN WAITING CARD -->
  <div id="wait-card" class="glass-card" style="display: none; text-align: center;">
    <div class="badge-hud">RESPONSE RECORDED</div>
    <div class="pin-display-box">
      <div style="font-size: 26px; font-weight: 900; color: var(--yellow-bright); margin-bottom: 6px;">Answer Locked In!</div>
      <div style="font-size: 14px; color: var(--text-muted);">Waiting for the host to reveal the correct result...</div>
    </div>
  </div>

  <!-- 5. FINAL STANDINGS CARD -->
  <div id="end-card" class="glass-card" style="display: none; text-align: center;">
    <div class="badge-hud">QUIZ COMPLETED</div>
    <div class="title-banner" style="font-size: 20px; margin-top: 10px;">FINAL STANDINGS</div>
    <div id="leaderboard-container" style="margin-top: 16px;"></div>
  </div>

  <script>
    let currentPin = '';
    let playerName = '';
    let selectedOption = null;
    let hasAnsweredCurrentRound = false;
    let lastSeenQuestionIndex = 0;
    let pollTimer = null;

    function showCard(cardId) {
      ['join-card', 'lobby-card', 'question-card', 'wait-card', 'end-card'].forEach(id => {
        document.getElementById(id).style.display = (id === cardId) ? 'block' : 'none';
      });
    }

    async function joinGame() {
      const pin = document.getElementById('pin-input').value.trim();
      const name = document.getElementById('name-input').value.trim();

      if (!pin || !name) {
        alert('Please enter both PIN and Name.');
        return;
      }

      const btn = document.getElementById('join-btn');
      btn.textContent = 'Connecting...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/join-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin, name })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          currentPin = pin;
          playerName = name;
          document.getElementById('display-player').textContent = name;
          showCard('lobby-card');
          startPolling();
        } else {
          alert('Failed to join: ' + (data.error || 'Invalid session PIN'));
          btn.textContent = 'Enter Session';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Network connection error: ' + err.message);
        btn.textContent = 'Enter Session';
        btn.disabled = false;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(fetchRoomStatus, 1500);
      fetchRoomStatus();
    }

    async function fetchRoomStatus() {
      if (!currentPin) return;

      try {
        const res = await fetch(`/api/room-status?pin=${currentPin}`);
        if (!res.ok) return;
        const data = await res.json();

        // Update score
        if (data.leaderboard) {
          const me = data.leaderboard.find(p => p.name.toLowerCase() === playerName.toLowerCase());
          if (me) {
            document.getElementById('score-counter').textContent = `Score: ${me.score}`;
          }
        }

        if (data.state === 'LOBBY') {
          showCard('lobby-card');
        } else if (data.state === 'QUESTION') {
          if (data.currentIndex !== lastSeenQuestionIndex) {
            lastSeenQuestionIndex = data.currentIndex;
            hasAnsweredCurrentRound = false;
            selectedOption = null;
            renderQuestion(data.question);
            showCard('question-card');
          } else {
            if (hasAnsweredCurrentRound) {
              showCard('wait-card');
            } else {
              showCard('question-card');
            }
          }
        } else if (data.state === 'REVEAL') {
          if (data.revealedAnswer !== null && data.revealedAnswer !== undefined) {
            highlightAnswers(data.revealedAnswer);
            showCard('question-card');
          }
        } else if (data.state === 'FINISHED') {
          clearInterval(pollTimer);
          showCard('end-card');

          const rows = data.leaderboard.map((p, idx) => `
            <div style="display:flex; justify-content:space-between; padding: 10px 16px; border-bottom: 1px solid rgba(250,204,21,0.2); font-size: 15px;">
              <span>#${idx + 1} ${p.name}</span>
              <span style="color:var(--yellow-bright);"><strong>${p.score} pts</strong> (${p.correctCount} correct)</span>
            </div>
          `).join('');

          document.getElementById('leaderboard-container').innerHTML = `
            <div style="background: #0f0f0f; border-radius: 12px; border: 1px solid rgba(250,204,21,0.3);">${rows}</div>
          `;
        }
      } catch (e) {
        console.error('Polling error', e);
      }
    }

    function renderQuestion(q) {
      if (!q) return;

      document.getElementById('level-badge').textContent = q.level || 'QUESTION';
      document.getElementById('question-text').textContent = q.question;

      for (let i = 0; i < 4; i++) {
        const tile = document.getElementById(`tile-${i}`);
        const span = document.getElementById(`opt-${i}`);
        span.textContent = q.options[i];
        tile.className = 'host-tile';
        tile.disabled = false;
      }

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Confirm Answer';
    }

    function selectOption(index) {
      if (hasAnsweredCurrentRound) return;

      selectedOption = index;
      for (let i = 0; i < 4; i++) {
        const tile = document.getElementById(`tile-${i}`);
        if (i === index) tile.classList.add('selected');
        else tile.classList.remove('selected');
      }

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = false;
    }

    async function submitAnswer() {
      if (selectedOption === null || hasAnsweredCurrentRound) return;

      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Locking In...';

      try {
        const res = await fetch('/api/submit-answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pin: currentPin,
            name: playerName,
            answerIndex: selectedOption
          })
        });

        const data = await res.json();
        if (res.ok && (data.success || data.message)) {
          hasAnsweredCurrentRound = true;
          showCard('wait-card');
        } else {
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirm Answer';
          alert(data.error || 'Failed to submit answer.');
        }
      } catch (err) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm Answer';
        alert('Network error while submitting answer.');
      }
    }

    function highlightAnswers(correctIndex) {
      for (let i = 0; i < 4; i++) {
        const tile = document.getElementById(`tile-${i}`);
        tile.disabled = true;
        if (i === correctIndex) {
          tile.className = 'host-tile correct';
        } else if (i === selectedOption) {
          tile.className = 'host-tile wrong';
        } else {
          tile.className = 'host-tile';
          tile.style.opacity = '0.3';
        }
      }
      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Answer Revealed';
    }
  </script>
</body>
</html>
