<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Player Quiz Portal</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg-black: #080808;
      --card-bg: rgba(18, 18, 18, 0.95);
      --card-border: rgba(250, 204, 21, 0.4);
      --yellow-bright: #facc15;
      --text-white: #ffffff;
      --text-muted: #a3a3a3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65vmin;
      max-width: 440px;
      height: auto;
      opacity: 0.045;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    #welcome-splash {
      position: fixed;
      inset: 0;
      background: var(--bg-black);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      animation: introSequence 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      pointer-events: none;
    }

    .splash-logo {
      max-width: 220px;
      width: 70%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 14px;
      border: 2px solid var(--yellow-bright);
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.4);
      margin-bottom: 24px;
      animation: popIn 0.6s ease-out forwards;
    }

    .splash-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--yellow-bright);
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes introSequence {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(250, 204, 21, 0.18);
      width: 100%;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    @media (min-width: 900px) {
      .glass-card {
        max-width: 980px;
        padding: 36px 44px;
        min-height: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .title-banner { font-size: 28px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 18px; }
      .host-tile { font-size: 18px; padding: 22px 18px; min-height: 75px; }
      #question-text { font-size: 24px; margin: 20px 0; }
      .splash-title { font-size: 36px; }
      .splash-logo { max-width: 280px; max-height: 280px; }
    }

    @media (max-width: 899px) {
      body { padding: 12px 10px; align-items: flex-start; }
      .glass-card {
        max-width: 480px;
        padding: 18px 16px;
        min-height: calc(100dvh - 24px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .title-banner { font-size: 20px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .host-tile { font-size: 15px; padding: 14px 12px; }
      #question-text { font-size: 17px; margin: 12px 0; }
      .splash-title { font-size: 22px; }
    }

    .club-banner-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1.5px solid var(--yellow-bright);
    }
    .club-banner {
      width: 100%;
      display: block;
      max-height: 125px;
      object-fit: cover;
    }

    .top-logo-container {
      text-align: center;
      margin: 4px 0 12px 0;
    }
    .top-logo {
      max-height: 70px;
      max-width: 80%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
    }

      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--yellow-bright);
